<svg xmlns="http://www.w3.org/2000/svg" class="hb-svg" viewBox="0 0 120 200" width="120" height="200" role="img" aria-label="Cute cartoon boy walking sideways with a glass of water" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Hydration Buddy side view (profile, facing right). Used while walking; buddy.svg is the front view.
       Mood parts default to neutral; page CSS switches them via data-state (see NOTES.md). -->
  <g class="hb-figure" stroke="#1E1A1A" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
    <ellipse class="hb-shadow" cx="60" cy="179" rx="24" ry="4.5" fill="#1B3A4B" fill-opacity="0.16" stroke="none"/>
    <g class="hb-body">
      <!-- back arm and leg (one shade darker) -->
      <g class="hb-arm hb-arm-back">
        <rect x="56.5" y="104" width="9" height="22" rx="4.5" fill="#E9B08F"/>
        <circle cx="61" cy="127" r="5.5" fill="#E9B08F"/>
        <rect x="54.5" y="94" width="13" height="15" rx="6" fill="#2380C8"/>
      </g>
      <g class="hb-leg hb-leg-back">
        <rect x="55" y="144" width="11" height="26" rx="3" fill="#E9B08F"/>
        <rect x="53" y="166" width="21" height="9" rx="4.5" fill="#E9B08F"/>
      </g>
      <!-- torso -->
      <rect x="45" y="128" width="31" height="20" rx="4" fill="#C68A5A"/>
      <rect x="44" y="91" width="33" height="44" rx="10" fill="#2B95E6"/>
      <g class="hb-leg hb-leg-front">
        <rect x="55" y="144" width="11" height="26" rx="3" fill="#F8CBAE"/>
        <rect x="53" y="166" width="21" height="9" rx="4.5" fill="#F8CBAE"/>
      </g>
      <!-- head -->
      <g class="hb-head">
        <circle cx="95.5" cy="72" r="4.2" fill="#F8CBAE"/>
        <ellipse cx="62" cy="60" rx="34" ry="33" fill="#F8CBAE"/>
        <path d="M33 82 C22 66 25 42 41 30 L37 22 L48 25 C55 20 63 19 71 21 L75 13 L79 23 C87 26 93 32 96 42 L102 44 L95 50 C93 47 89 46 86 48 L84 55 L80 47 L75 54 L72 46 C65 48 59 51 57 57 C52 56 47 59 45 65 C43 71 41 77 39 84 Z" fill="#A4552C"/>
        <path d="M47 31 C54 26 61 25 68 25" fill="none" stroke="#C7703D" stroke-width="2"/>
        <circle cx="54" cy="68" r="8.5" fill="#F8CBAE"/>
        <path d="M52 64 q4 3 0 8" fill="none" stroke-width="1.8"/>
        <circle cx="80" cy="78" r="6.5" fill="#EE9988" fill-opacity="0.8" stroke="none"/>
        <path class="hb-brows hb-brows-neutral" d="M78 58 Q82 55.5 86 58" fill="none" stroke-width="2.2"/>
        <path class="hb-brows hb-brows-sad" d="M77 55.5 Q81 59 86 59" fill="none" stroke-width="2.2" display="none"/>
        <g class="hb-eyes" stroke="none">
          <ellipse cx="83" cy="67" rx="3.2" ry="4.6" fill="#1E1A1A"/>
          <circle cx="84" cy="65.2" r="1.2" fill="#FFFFFF"/>
        </g>
        <path class="hb-eyes-happy" d="M79 68 Q83 62.5 87 68" fill="none" stroke-width="2.6" display="none"/>
        <g class="hb-mouth hb-mouth-neutral">
          <path d="M82 81 Q88 82.5 93 80 Q91.5 88.5 86.5 88.5 Q82.5 88 82 81 Z" fill="#8E2D2D" stroke-width="2.2"/>
          <path d="M84 86 Q87.5 83.5 91 85.5 Q87.5 88 84 86 Z" fill="#F07C7C" stroke="none"/>
        </g>
        <g class="hb-mouth hb-mouth-happy" display="none">
          <path d="M80 80 Q88 82.5 95 78 Q93 91 86.5 91 Q81 90.5 80 80 Z" fill="#8E2D2D" stroke-width="2.2"/>
          <path d="M83 87 Q87.5 84 92 86 Q87.5 89.5 83 87 Z" fill="#F07C7C" stroke="none"/>
        </g>
        <path class="hb-mouth hb-mouth-sad" d="M82 86 Q87 81.5 92 85" fill="none" stroke-width="2.2" display="none"/>
        <path class="hb-tear" d="M81 71 C81 71 78 76 78 78.5 a3 3 0 0 0 6 0 C84 76 81 71 81 71 Z" fill="#8AD3F7" stroke="#3E86B5" stroke-width="1.1" display="none"/>
