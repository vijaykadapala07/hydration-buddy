<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'">
<title>Hydration Buddy</title>
<style>
@font-face { font-family: "Baloo 2"; font-weight: 600; src: url("fonts/baloo-2-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Baloo 2"; font-weight: 800; src: url("fonts/baloo-2-latin-800-normal.woff2") format("woff2"); }
*{box-sizing:border-box}
html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none; }
:root { --f-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif; }
.hb-stage { position: fixed; inset: 0; }

/* =====================================================================
   HYDRATION BUDDY COMPONENT (copy everything from here to END COMPONENT)
   ===================================================================== */
.hb-walker {
  --hb-enter: 1.68s; --hb-happy: 2.24s; --hb-sad: 3.4s;     /* travel time  */
  --step: .42s; --leg-amp: 26deg; --arm-amp: 28deg; --bob: -6px; /* gait */
  position: absolute; bottom: 14px; left: -140px; width: 120px; height: 200px;
}
.hb-walker[data-state="idle"] { left: calc(50% - 60px); }
.hb-walker[data-state="enter"] { animation: hb-enter var(--hb-enter) linear both; }
.hb-walker[data-state="happy"] { animation: hb-exit-right var(--hb-happy) cubic-bezier(.45,.1,.7,.9) both;
  --step: .32s; --leg-amp: 36deg; --arm-amp: 44deg; --bob: -11px; }
.hb-walker[data-state="sad"] { animation: hb-exit-left var(--hb-sad) cubic-bezier(.4,.1,.6,.95) both;
  --step: .68s; --leg-amp: 16deg; --arm-amp: 18deg; --bob: -2px; }
@keyframes hb-enter { from { left: -140px; } to { left: calc(50% - 60px); } }
@keyframes hb-exit-right { from { left: calc(50% - 60px); } to { left: calc(100% + 20px); } }
@keyframes hb-exit-left { from { left: calc(50% - 60px); } to { left: -140px; } }

.hb-facing { position: relative; width: 100%; height: 100%; }
/* side view while walking, front view while waiting at the center */
.hb-pose { position: absolute; inset: 0; }
.hb-pose-front, .hb-pose-crawl { display: none; }
.hb-walker[data-state="idle"] .hb-pose-side { display: none; }
.hb-walker[data-state="idle"] .hb-pose-front { display: block; animation: hb-arrive .3s ease-out both; }
.hb-walker[data-state="happy"] .hb-pose-side { animation: hb-turn .18s ease-out both; }
/* on "No" he drops to his knees and crawls away crying */
.hb-walker[data-state="sad"] .hb-pose-side { display: none; }
.hb-walker[data-state="sad"] .hb-pose-crawl { display: block; animation: hb-drop .35s ease-out both; }
.hb-walker[data-state="sad"] .hb-pose-crawl .hb-head { animation: hb-sob .34s ease-in-out infinite; }
.hb-walker[data-state="sad"] .hb-tear-2 { animation-delay: -.85s; }
.hb-walker[data-state="sad"] .hb-facing { transform: scaleX(-1); }
.hb-svg { display: block; width: 100%; height: 100%; overflow: visible; }
.hb-svg * { transform-box: fill-box; }
.hb-leg, .hb-arm { transform-origin: 50% 0; }
.hb-body { transform-origin: 50% 100%; }
.hb-head { transform-origin: 50% 100%; transition: transform .4s ease; }
.hb-eyes { transform-origin: 50% 50%; animation: hb-blink 4s infinite; }
.hb-leg { --amp: var(--leg-amp); }
.hb-arm { --amp: var(--arm-amp); }

/* gait: legs and arms swing in opposition, body bobs twice per cycle */
:is([data-state="enter"], [data-state="happy"], [data-state="sad"]) :is(.hb-leg, .hb-arm) {
  animation: hb-swing var(--step) ease-in-out infinite; }
:is([data-state="enter"], [data-state="happy"], [data-state="sad"]) :is(.hb-leg-back, .hb-arm-front) {
  animation-delay: calc(var(--step) / -2); }
:is([data-state="enter"], [data-state="happy"]) .hb-body {
  animation: hb-waddle var(--step) ease-in-out infinite; }
:is([data-state="enter"], [data-state="happy"]) .hb-pose-side .hb-head {
  animation: hb-nod var(--step) ease-in-out infinite; }
[data-state="sad"] .hb-body { animation: hb-bob var(--step) ease-in-out infinite; }
[data-state="idle"] .hb-body { animation: hb-breathe 2.6s ease-in-out infinite; }
.hb-hold { transform-origin: 50% 0; transition: transform .3s ease; }
[data-state="happy"] .hb-hold { animation: hb-cheer calc(var(--step) * 2) ease-in-out infinite; }
[data-state="sad"] .hb-hold { transform: translateY(4px); }
[data-state="sad"] .hb-head { transform: translateY(3px) rotate(9deg); }

/* moods: swap face parts (SVG display attributes are overridden by CSS) */
.hb-walker[data-state="happy"] :is(.hb-mouth-happy, .hb-bottle, .hb-eyes-happy) { display: inline; }
.hb-walker[data-state="happy"] .hb-eyes { display: none; }
.hb-walker[data-state="sad"] :is(.hb-mouth-sad, .hb-brows-sad) { display: inline; }
.hb-walker:is([data-state="happy"], [data-state="sad"]) .hb-mouth-neutral { display: none; }
.hb-walker[data-state="sad"] .hb-brows-neutral { display: none; }
.hb-walker[data-state="sad"] .hb-tear { display: inline; animation: hb-tear 1.7s ease-in infinite; }

/* speech bubble, shown while waiting for the answer */
.hb-bubble { position: absolute; bottom: 194px; left: 50%; transform: translateX(-50%); white-space: nowrap;
  display: none; align-items: center; gap: 10px; padding: 9px 18px 10px 10px; border-radius: 24px;
  background: linear-gradient(180deg, #FFFFFF 0%, #E2F3FD 100%); border: 3px solid #1E1A1A;
  box-shadow: 0 5px 0 #1E1A1A; color: #12303D; }
.hb-bubble::after { content: ""; position: absolute; left: 50%; bottom: -10px; width: 14px; height: 14px;
  background: #E2F3FD; border: solid #1E1A1A; border-width: 0 3px 3px 0; border-radius: 0 0 4px 0;
  transform: translateX(-50%) rotate(45deg); }
.hb-bubble-icon { flex: none; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%;
  background: #2B95E6; border: 2.5px solid #1E1A1A; }
.hb-bubble-icon svg { width: 16px; height: 20px; display: block; }
.hb-bubble-text { display: grid; gap: 1px; }
.hb-bubble-kicker { font: 800 .68rem/1 var(--f-display, system-ui); letter-spacing: .12em; text-transform: uppercase; color: #2B95E6; }
.hb-bubble-line { font: 800 1.12rem/1.1 var(--f-display, system-ui); }
.hb-bubble-line em { font-style: normal; color: #1F7FC4; text-decoration: underline wavy #6CC1F0 2px; text-underline-offset: 4px; }
.hb-walker[data-state="idle"] .hb-bubble { display: flex;
  animation: hb-pop .4s cubic-bezier(.3,1.6,.6,1) both, hb-float 2.8s ease-in-out .4s infinite; }

@keyframes hb-swing { 0%, 100% { transform: rotate(var(--amp)); } 50% { transform: rotate(calc(var(--amp) * -1)); } }
@keyframes hb-cheer { 0%, 100% { transform: translateY(-2px); } 50% { transform: translateY(-6px); } }
@keyframes hb-bob { 0%, 50%, 100% { transform: translateY(0); } 25%, 75% { transform: translateY(var(--bob)); } }
@keyframes hb-breathe { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.02); } }
@keyframes hb-blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
@keyframes hb-tear { 0% { transform: translateY(-2px); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(16px); opacity: 0; } }
@keyframes hb-waddle { 0%, 100% { transform: translateY(0) rotate(-4deg) scaleY(.97); } 25%, 75% { transform: translateY(var(--bob)) rotate(0deg) scaleY(1.02); }
  50% { transform: translateY(0) rotate(4deg) scaleY(.97); } }
@keyframes hb-nod { 0%, 50%, 100% { transform: rotate(-3deg); } 25%, 75% { transform: rotate(3deg); } }
@keyframes hb-arrive { 0% { transform: scaleX(.1); } 55% { transform: translateY(-10px) scaleX(1.06); } 100% { transform: none; } }
@keyframes hb-drop { 0% { transform: translateY(-14px) scaleY(1.1); } 60% { transform: translateY(2px) scaleY(.92); } 100% { transform: none; } }
@keyframes hb-sob { 0%, 100% { transform: translateY(2px) rotate(6deg); } 50% { transform: translateY(-1px) rotate(3deg); } }
@keyframes hb-turn { from { transform: scaleX(.15); } to { transform: scaleX(1); } }
@keyframes hb-pop { from { transform: translateX(-50%) translateY(8px) scale(.6); opacity: 0; } to { transform: translateX(-50%) scale(1); opacity: 1; } }
@keyframes hb-float { 0%, 100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(-4px); } }

/* attention grabber: no answer within 3 s, he jumps, shouts and waves the glass */
.hb-pose-front { transform-origin: 50% 100%; }
.hb-shout { position: absolute; bottom: 150px; display: none; pointer-events: none;
  font: 800 1.6rem/1 var(--f-display, system-ui); color: #FF6B5E; -webkit-text-stroke: 1.5px #1E1A1A; }
.hb-shout-l { left: -16px; --tilt: -18deg; }
.hb-shout-r { right: -12px; --tilt: 16deg; }
.hb-walker[data-attn="on"] .hb-shout { display: block; animation: hb-shout .3s ease-in-out infinite alternate; }
.hb-walker[data-attn="on"] .hb-pose-front { animation: hb-jump 1.2s ease-out both; }
.hb-walker[data-attn="on"] .hb-pose-front .hb-mouth-neutral { display: none; }
.hb-walker[data-attn="on"] .hb-pose-front .hb-mouth-happy { display: inline; }
.hb-walker[data-attn="on"] .hb-hold { animation: hb-cheer .3s ease-in-out infinite; }
.hb-walker[data-attn="on"] .hb-bubble { animation: hb-wiggle .14s ease-in-out 6 alternate both; }
.hb-walker[data-attn="on"] .hb-bubble-kicker { color: #E2574C; }
@keyframes hb-jump {
  0% { transform: none; } 8% { transform: scale(1.08, .9); } 20% { transform: translateY(-34px) scale(.95, 1.06); }
  32% { transform: scale(1.08, .9); } 44% { transform: translateY(-26px) scale(.96, 1.05); } 56% { transform: scale(1.06, .92); }
  68% { transform: translateY(-16px); } 80% { transform: scale(1.04, .95); } 100% { transform: none; } }
@keyframes hb-shout { from { transform: rotate(var(--tilt)) scale(.85); } to { transform: rotate(var(--tilt)) translateY(-6px) scale(1.15); } }
@keyframes hb-wiggle { from { transform: translateX(-50%) rotate(-3deg); } to { transform: translateX(-50%) rotate(3deg) scale(1.04); } }

@media (prefers-reduced-motion: reduce) {
  .hb-walker, .hb-walker * { animation-duration: 1ms !important; animation-iteration-count: 1 !important; }
}

/* ---------- desktop overrides: walk the full width of the screen ---------- */
/* JS sets --x-start / --x-center / --x-end in px and picks travel times from the distance,
   rounded to whole step cycles so the legs still land on the same pose. */
.hb-walker { bottom: -6px; left: var(--x-start, -160px); }
.hb-walker[data-state="idle"] { left: var(--x-center); }
@keyframes hb-enter { from { left: var(--x-start); } to { left: var(--x-center); } }
@keyframes hb-exit-right { from { left: var(--x-center); } to { left: var(--x-end); } }
@keyframes hb-exit-left { from { left: var(--x-center); } to { left: var(--x-start); } }
.hb-walker[data-state="hidden"] { visibility: hidden; }
.hb-svg { filter: drop-shadow(0 2px 3px rgba(0,0,0,.25)); }

/* the question bubble carries the answer buttons */
.hb-walker[data-state="idle"] .hb-bubble { display: grid; grid-template-columns: auto auto; column-gap: 10px; row-gap: 10px;
  padding: 10px 14px 12px 10px; bottom: 192px; }
.hb-answers { grid-column: 1 / -1; display: flex; gap: 8px; justify-content: center; }
.hb-btn { font: 800 1rem/1 var(--f-display); border: 3px solid #1E1A1A; border-radius: 999px; padding: 8px 18px 7px;
  cursor: pointer; box-shadow: 0 3px 0 #1E1A1A; color: #fff; transition: transform .08s ease, box-shadow .08s ease; }
.hb-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 0 #1E1A1A; }
.hb-btn:active { transform: translateY(3px); box-shadow: 0 0 0 #1E1A1A; }
.hb-btn.yes { background: #2F9E5F; }
.hb-btn.no { background: #D0604F; }
.hb-btn:focus-visible { outline: 3px solid #2B95E6; outline-offset: 2px; }
</style>
</head>
