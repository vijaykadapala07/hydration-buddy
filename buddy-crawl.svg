<svg xmlns="http://www.w3.org/2000/svg" class="hb-svg" viewBox="0 0 120 200" width="120" height="200" role="img" aria-label="Cartoon boy crawling away on his knees, crying" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Hydration Buddy crawl pose (facing right, mirrored in the page to go left). Used for the "No" answer.
