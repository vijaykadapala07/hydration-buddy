<svg xmlns="http://www.w3.org/2000/svg" class="hb-svg" viewBox="0 0 120 200" width="120" height="200" role="img" aria-label="Cute cartoon boy holding a glass of water" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Hydration Buddy v3: chibi boy in a blue T-shirt and brown shorts, holding a glass of water
